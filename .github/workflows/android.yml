name: Android APK

# Push a tag like v0.1.0 to build a signed APK and attach it to that GitHub release.
# Run it by hand (workflow_dispatch) to get the APK as a build artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Prisma generate (postinstall) needs a URL; nothing connects to it here.
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir mobile exec cap sync android

      - name: Version from the tag
        run: |
          name="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          echo "KASVO_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "KASVO_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kasvo-release.p12"
          echo "KASVO_KEYSTORE_PATH=$RUNNER_TEMP/kasvo-release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: mobile/android
        env:
          KASVO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KASVO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name and check the APK
        run: |
          apk="kasvo-${KASVO_VERSION_NAME}.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/kasvo-release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: kasvo-apk
          path: kasvo-*.apk*

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "Kasvo $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
