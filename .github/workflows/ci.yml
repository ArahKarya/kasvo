name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kasvo
          POSTGRES_PASSWORD: kasvo
          POSTGRES_DB: kasvo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kasvo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kasvo:kasvo@localhost:5432/kasvo_test
      TEST_DATABASE_URL: postgresql://kasvo:kasvo@localhost:5432/kasvo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
